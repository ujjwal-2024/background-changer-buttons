<!doctype html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background changer buttons</title>
    <style>
        body {
            text-align: center;
            padding-top: 50px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Background Changer Buttons</h1>
   <!-- 
    <button onclick="document.body.style.backgroundColor = 'lightblue'">Light Blue</button>
    <button onclick="document.body.style.backgroundColor = 'lightgreen'">Light Green</button>
    <button onclick="document.body.style.backgroundColor = 'lightcoral'">Light Coral    </button>
    <button onclick="document.body.style.backgroundColor = 'lightgoldenrodyellow'"> Light Goldenrod Yellow</button>
    <button onclick="document.body.style.backgroundColor = 'white'">Reset to White</    button>
    -->
    <div id="parent">
        <button id="red" style="background-color: red;">Red</button>
        <button id="blue" style="background-color: blue;">Blue</button>
        <button id="orange" style="background-color: orange;">Orange</button>
        <button id="pink" style="background-color: pink;">Pink</button>
        <button id="green" style="background-color: green;">green</button>
    </div>
</body>
</html>
